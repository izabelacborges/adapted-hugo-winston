<div class="footer">
  {{ if hugo.Data.social.links }}
  <div class="footer-social">
    {{ range hugo.Data.social.links }}
      <span class="social-icon social-icon-{{ .name | urlize }}">
        <a href="{{ .url }}" title="{{ .name }}" aria-label="{{ .name }}" target="_blank" rel="noopener">
          <span class="social-icon-image" style="--icon: url('{{ .image | relURL }}')" aria-hidden="true"></span>
        </a>
      </span>
    {{ end }}
  </div>
  {{ end }}
</div>
